name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CodeQL and dependency-review are omitted while this repo is private: both
# need GitHub Advanced Security on private repos. Add the shared-codeql.yml and
# shared-dependency-review.yml jobs (see relay/README.md) once it goes public.
jobs:
  ci:
    uses: OpenPhysics/relay/.github/workflows/ci.yml@main
